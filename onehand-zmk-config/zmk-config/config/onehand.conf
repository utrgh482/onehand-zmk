# 한손 키보드 1호 — 동작 설정

# 블루투스 송신 세기 (최대)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# 15분 동안 입력이 없으면 깊은 잠 (배터리 절약). 아무 키나 누르면 깨어남
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# 노브
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# ZMK Studio (컴퓨터 화면에서 키 배치를 바로 바꾸는 기능)
CONFIG_ZMK_STUDIO=y

# 배터리 잔량을 컴퓨터에 알림
CONFIG_ZMK_BATTERY_REPORTING=y
